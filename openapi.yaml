        status:
          $ref: '#/components/schemas/CustomerStatus'
        externalCrmId:
          type: [string, 'null']
          example: sf_0018Z00002X9abc
        region:
          type: string
          example: us-east
        annualRecurringRevenue:
          type: [integer, 'null']
          minimum: 0
          maximum: 2000000000
          description: Whole USD; returned only with customers:arr:read
          x-required-scope: customers:arr:read
        version:
          type: integer
          minimum: 1
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    CreateCustomerRequest:
