          enum: [COMPLETED]
        consistentAccountIds:
          type: array
          items:
            type: string
        customersUpserted:
          type: integer
        entitlementsUpserted:
          type: integer
        usageEventsUpserted:
          type: integer
        completedAt:
          type: string
          format: date-time

    IntegrationSyncRun:
      type: object
      required: [id, sourceSummary, status, customersProcessed, entitlementsProcessed, usageEventsProcessed, startedAt]
      properties:
        id:
          type: string
        sourceSummary:
          type: string
        status:
          type: string
          enum: [COMPLETED, FAILED]
        customersProcessed:
          type: integer
        entitlementsProcessed:
          type: integer
        usageEventsProcessed:
          type: integer
        errorDetail:
          type: [string, 'null']
        startedAt:
          type: string
          format: date-time
        completedAt:
          type: [string, 'null']
          format: date-time

    IntegrationSyncRunListResponse:
      type: object
      required: [data, page]
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/IntegrationSyncRun'
        page:
          $ref: '#/components/schemas/PageMeta'

    AuditEvent:
      type: object
      required: [id, actorId, actorScopes, action, entityType, entityId, createdAt]
      properties:
        id:
          type: string
        accountId:
          type: [string, 'null']
        actorId:
          type: string
        actorScopes:
          type: string
        action:
          type: string
          example: case.created
        entityType:
          type: string
          example: SupportCase
        entityId:
          type: string
        traceId:
          type: [string, 'null']
        metadata:
          type: object
          additionalProperties: true
        createdAt:
          type: string
          format: date-time

    AuditEventListResponse:
      type: object
      required: [data, page]
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/AuditEvent'
        page:
          $ref: '#/components/schemas/PageMeta'

    WebhookEventType:
      type: string
      enum:
        - customer.created
        - customer.updated
        - entitlement.created
        - entitlement.updated
        - usage.threshold.exceeded
        - case.created
        - case.updated
        - case.escalated

    WebhookEndpoint:
      type: object
      required: [id, url, subscribedEvents, active, version, createdAt, updatedAt]
      properties:
        id:
          type: string
        url:
          type: string
          format: uri
        description:
          type: [string, 'null']
        subscribedEvents:
          type: array
          items:
            $ref: '#/components/schemas/WebhookEventType'
        active:
          type: boolean
        version:
          type: integer
          minimum: 1
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    WebhookEndpointCreated:
      allOf:
        - $ref: '#/components/schemas/WebhookEndpoint'
        - type: object
          required: [signingSecret]
          properties:
            signingSecret:
              type: string
              description: Returned once on creation for HMAC-SHA256 verification

    CreateWebhookEndpointRequest:
      type: object
      required: [url, subscribedEvents]
      properties:
        url:
          type: string
          format: uri
        description:
          type: string
        subscribedEvents:
          type: array
          minItems: 1
          items:
            $ref: '#/components/schemas/WebhookEventType'
        signingSecret:
          type: string
          minLength: 16
          maxLength: 128

    WebhookEndpointListResponse:
      type: object
      required: [data, page]
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/WebhookEndpoint'
        page:
          $ref: '#/components/schemas/PageMeta'

    WebhookDeliveryStatus:
      type: string
      enum: [PENDING, DELIVERED, FAILED]

    WebhookDelivery:
      type: object
      required: [id, endpointId, eventType, status, signatureHeader, attemptCount, payload, createdAt]
      properties:
        id:
          type: string
        endpointId:
          type: string
        eventType:
          $ref: '#/components/schemas/WebhookEventType'
        accountId:
          type: [string, 'null']
        status:
          $ref: '#/components/schemas/WebhookDeliveryStatus'
        signatureHeader:
          type: string
        attemptCount:
          type: integer
        responseStatus:
          type: [integer, 'null']
        lastError:
          type: [string, 'null']
        payload:
          $ref: '#/components/schemas/WebhookEventEnvelope'
        deliveredAt:
          type: [string, 'null']
          format: date-time
        createdAt:
          type: string
          format: date-time

    WebhookDeliveryListResponse:
      type: object
      required: [data, page]
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/WebhookDelivery'
        page:
          $ref: '#/components/schemas/PageMeta'

    WebhookEventEnvelope:
      type: object
      required: [id, specVersion, type, occurredAt, data]
      properties:
        id:
          type: string
        specVersion:
          type: string
          enum: ['1.0']
        type:
          $ref: '#/components/schemas/WebhookEventType'
        accountId:
          type: [string, 'null']
        occurredAt:
          type: string
          format: date-time
        data:
          type: object
          additionalProperties: true
