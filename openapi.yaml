          $ref: '#/components/schemas/PageMeta'

    CustomerOverview:
      allOf:
        - $ref: '#/components/schemas/Customer'
        - type: object
          required: [entitlements, usage, cases, generatedAt, partialFailures]
          properties:
            entitlements:
              type: [array, 'null']
              description: Available with entitlements:read; null when unauthorized or the section fails.
              items:
                $ref: '#/components/schemas/Entitlement'
            usage:
