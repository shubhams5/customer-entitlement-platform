                type: object
                required: [section, code]
                properties:
                  section:
                    type: string
                    enum: [entitlements, usage, cases]
                  code:
                    type: string
                    enum: [SECTION_UNAVAILABLE, SECTION_FORBIDDEN]

    EntitlementKind:
