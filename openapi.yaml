          type: string
          format: email
        tier:
          $ref: '#/components/schemas/CustomerTier'
        status:
          $ref: '#/components/schemas/CustomerStatus'
          default: ACTIVE
        externalCrmId:
          type: string
        region:
          type: string
          default: us-east
        annualRecurringRevenue:
          type: integer
          minimum: 0
          maximum: 2000000000
          description: Whole USD; writable only with customers:arr:write
          x-required-scope: customers:arr:write

    UpdateCustomerRequest:
      type: object
      minProperties: 1
      properties:
        name:
          type: string
          minLength: 2
          maxLength: 200
        primaryEmail:
          type: string
          format: email
        tier:
          $ref: '#/components/schemas/CustomerTier'
        status:
          $ref: '#/components/schemas/CustomerStatus'
        region:
          type: string
        annualRecurringRevenue:
          type: [integer, 'null']
          minimum: 0
          maximum: 2000000000
          description: Whole USD; writable only with customers:arr:write
