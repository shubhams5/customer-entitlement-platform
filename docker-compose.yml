x-platform-environment: &platform-environment
  DATABASE_URL: file:/data/customer-entitlement-platform.db
  HOST: 0.0.0.0
  PORT: "3000"
  FIXTURES_DIR: fixtures
  OAUTH_JWT_SECRET: ${OAUTH_JWT_SECRET:-local-dev-hs256-signing-secret-change-in-prod-9f86d081}
  OAUTH_ISSUER: ${OAUTH_ISSUER:-https://auth.platform.local}
  OAUTH_AUDIENCE: ${OAUTH_AUDIENCE:-https://api.platform.local}

services:
  db-init:
    build:
      context: .
    environment: *platform-environment
    volumes:
      - platform-data:/data
    command:
      - sh
      - -c
      - npm run prisma:deploy && npm run db:seed
    restart: "no"

  api:
    build:
      context: .
    environment: *platform-environment
    depends_on:
      db-init:
        condition: service_completed_successfully
    ports:
      - "127.0.0.1:${HOST_PORT:-3000}:3000"
    volumes:
      - platform-data:/data
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - fetch('http://127.0.0.1:3000/health').then((r) => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 10s

  mcp:
    build:
      context: .
    environment:
      NEST_API_BASE_URL: http://api:3000
      MCP_OAUTH_CLIENT_ID: ${MCP_OAUTH_CLIENT_ID:-support-agent-client}
      MCP_OAUTH_CLIENT_SECRET: ${MCP_OAUTH_CLIENT_SECRET:-dev-secret-support-agent}
      MCP_OAUTH_SCOPES: ${MCP_OAUTH_SCOPES:-customers:read cases:read cases:write}
      OAUTH_JWT_SECRET: ${OAUTH_JWT_SECRET:-local-dev-hs256-signing-secret-change-in-prod-9f86d081}
      OAUTH_ISSUER: ${OAUTH_ISSUER:-https://auth.platform.local}
      OAUTH_AUDIENCE: ${OAUTH_AUDIENCE:-https://api.platform.local}
    depends_on:
      api:
        condition: service_healthy
    command: ["npm", "run", "mcp:compose"]
    stdin_open: true

  test:
    build:
      context: .
    profiles: ["test"]
    environment:
      DATABASE_URL: file:./dev.db
      OAUTH_JWT_SECRET: ${OAUTH_JWT_SECRET:-local-dev-hs256-signing-secret-change-in-prod-9f86d081}
      OAUTH_ISSUER: ${OAUTH_ISSUER:-https://auth.platform.local}
      OAUTH_AUDIENCE: ${OAUTH_AUDIENCE:-https://api.platform.local}
      FIXTURES_DIR: fixtures
    command: ["npm", "run", "test:all"]

volumes:
  platform-data:
